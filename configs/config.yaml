project:
  name: "AcousticSpace"
  version: "1.0.0"
  description: "Industry-Level Deepfake Audio & Room Impulse Decay Acoustic Forensics Platform"

dataset:
  raw_dir: "../dataset-20260722T193837Z-1-001/dataset"
  manifest_output: "backend/data/processed/dataset_manifest.csv"
  feature_cache: "backend/data/processed/acoustic_features.csv"
  sample_rate: 16000
  duration_seconds: 2.0
  n_fft: 1024
  hop_length: 256
  mel_bands: 16
  n_mfcc: 20

model:
  artifact_path: "backend/model_artifacts/acousticspace_model.joblib"
  metrics_path: "backend/model_artifacts/metrics.json"
  feature_importance_path: "backend/model_artifacts/feature_importance.csv"
  validation_strategy: "StratifiedGroupKFold"
  cv_splits: 5
  seed: 42

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["http://localhost:5173", "http://localhost:3000"]
  max_upload_mb: 40
