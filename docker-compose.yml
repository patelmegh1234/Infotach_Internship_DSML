services:
  backend:
    build:
      context: ./backend
    container_name: acousticspace-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MAX_UPLOAD_MB: 40
      MODEL_MODE: baseline
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/model_artifacts:/app/model_artifacts

  frontend:
    build:
      context: ./frontend
    container_name: acousticspace-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

